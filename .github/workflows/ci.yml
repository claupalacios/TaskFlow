name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TaskFlow.slnx

      - name: Format check
        run: dotnet format TaskFlow.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build TaskFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskFlow.slnx --configuration Release --no-build

  frontend:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/taskflow-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/taskflow-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
